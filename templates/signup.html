<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f8f8f5">
	<title>Create an account — Axiom</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #202b27;
			--muted: #6d7872;
			--green: #245c49;
			--green-dark: #194b3a;
			--mint: #e8f0e9;
			--paper: #f8f8f5;
			--white: #fff;
			--line: #e7e9e3;
			--serif: Georgia, "Times New Roman", serif;
			--sans: "DM Sans", sans-serif;
			--display: "Manrope", sans-serif;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			background: var(--paper);
			color: var(--ink);
			font-family: var(--sans);
			-webkit-font-smoothing: antialiased;
		}
		a { color: inherit; text-decoration: none; }
		button, input { font: inherit; }

		.topbar {
			height: 78px;
			display: flex;
			align-items: center;
			padding: 0 24px;
		}
		.nav {
			width: min(1120px, 100%);
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font: 800 20px var(--display);
			letter-spacing: -1px;
		}
		.brand-mark {
			width: 31px;
			height: 31px;
			display: grid;
			place-items: center;
			color: white;
			background: var(--green);
			border-radius: 10px 10px 10px 3px;
		}
		.brand-mark svg { width: 18px; height: 18px; }
		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			color: var(--muted);
			font-size: 13px;
			font-weight: 600;
			transition: color 0.2s;
		}
		.back-link:hover { color: var(--green); }
		.back-link svg { width: 16px; height: 16px; }

		main {
			flex: 1;
			display: grid;
			place-items: center;
			padding: 20px 18px 60px;
			position: relative;
			overflow: hidden;
		}
		.bg-blob {
			position: absolute;
			width: 520px;
			height: 520px;
			border-radius: 48% 52% 43% 57% / 49% 42% 58% 51%;
			background: #e8eee6;
			z-index: 0;
			pointer-events: none;
			transform: rotate(10deg);
		}

		.auth-card {
			position: relative;
			z-index: 1;
			width: 100%;
			max-width: 440px;
			padding: 36px 34px;
			background: var(--white);
			border: 1px solid rgba(32, 43, 39, 0.08);
			border-radius: 16px;
			box-shadow: 0 20px 50px rgba(35, 55, 43, 0.07);
		}

		.auth-header {
			text-align: center;
			margin-bottom: 24px;
		}
		.eyebrow {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			color: var(--green);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.1px;
			text-transform: uppercase;
			margin-bottom: 10px;
		}
		.eyebrow-dot {
			width: 6px;
			height: 6px;
			background: #e6a967;
			border-radius: 50%;
		}
		h1 {
			margin: 0 0 8px;
			font: 700 28px/1.15 var(--display);
			letter-spacing: -1.2px;
		}
		h1 em {
			color: var(--green);
			font: italic 500 1em var(--serif);
			letter-spacing: -0.5px;
		}
		.auth-sub {
			margin: 0;
			color: var(--muted);
			font-size: 13px;
			line-height: 1.6;
		}

		.form-group { margin-bottom: 15px; }
		label {
			display: block;
			margin-bottom: 6px;
			font-size: 12px;
			font-weight: 600;
			color: var(--ink);
		}
		input[type="text"],
		input[type="email"],
		input[type="password"] {
			width: 100%;
			height: 44px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 9px;
			background: var(--paper);
			color: var(--ink);
			font-size: 13px;
			transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
		}
		input:focus {
			outline: none;
			background: var(--white);
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgba(36, 92, 73, 0.12);
		}
		input::placeholder { color: #9aa19c; }

		.subject-pills {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 8px;
		}
		.pill-option {
			position: relative;
		}
		.pill-option input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}
		.pill-label {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 38px;
			margin: 0;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--paper);
			color: var(--muted);
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
			user-select: none;
		}
		.pill-option input:checked + .pill-label {
			background: var(--mint);
			border-color: var(--green);
			color: var(--green-dark);
		}

		.button {
			width: 100%;
			height: 44px;
			margin-top: 8px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			border: 0;
			border-radius: 9px;
			background: var(--green);
			color: white;
			font-size: 13px;
			font-weight: 700;
			cursor: pointer;
			transition: background 0.2s, transform 0.2s;
		}
		.button:hover {
			background: var(--green-dark);
			transform: translateY(-1px);
		}
		.button svg { width: 16px; height: 16px; }

		.auth-footer {
			margin-top: 22px;
			text-align: center;
			font-size: 12px;
			color: var(--muted);
		}
		.auth-footer a {
			color: var(--green);
			font-weight: 700;
		}
		.auth-footer a:hover { text-decoration: underline; }
	</style>
</head>
<body>
	<header class="topbar">
		<nav class="nav" aria-label="Secondary navigation">
			<a class="brand" href="{{ url_for('home') }}" aria-label="Axiom home">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none">
						<path d="M5 6.5c2.8-.9 5.2-.5 7 1.1v11c-1.8-1.6-4.2-2-7-1.1v-11Zm14 0c-2.8-.9-5.2-.5-7 1.1v11c1.8-1.6 4.2-2 7-1.1v-11Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
					</svg>
				</span>
				Axiom
			</a>
			<a class="back-link" href="{{ url_for('home') }}">
				<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
					<path d="M16 10H5m4-4-4 4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				Back to home
			</a>
		</nav>
	</header>

	<main>
		<div class="bg-blob" aria-hidden="true"></div>

		<section class="auth-card" aria-labelledby="signup-title">
			<div class="auth-header">
				<div class="eyebrow"><span class="eyebrow-dot"></span> 100% Free for students</div>
				<h1 id="signup-title">Start your study <em>rhythm.</em></h1>
				<p class="auth-sub">Create an account to build your AS Level study plan and track your progress.</p>
			</div>

			<form method="POST" action="{{ url_for('signup_page') }}">
				<div class="form-group">
					<label for="full_name">Full name</label>
					<input id="full_name" name="full_name" type="text" placeholder="Alex Morgan" required autocomplete="name">
				</div>

				<div class="form-group">
					<label for="email">Student email</label>
					<input id="email" name="email" type="email" placeholder="you@school.edu" required autocomplete="email">
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
				</div>

				<div class="form-group">
					<label>What are you studying?</label>
					<div class="subject-pills">
						<div class="pill-option">
							<input type="checkbox" id="sub-bio" name="subjects" value="Biology">
							<label class="pill-label" for="sub-bio">Biology</label>
						</div>
						<div class="pill-option">
							<input type="checkbox" id="sub-chem" name="subjects" value="Chemistry">
							<label class="pill-label" for="sub-chem">Chemistry</label>
						</div>
						<div class="pill-option">
							<input type="checkbox" id="sub-phys" name="subjects" value="Physics">
							<label class="pill-label" for="sub-phys">Physics</label>
						</div>
						<div class="pill-option">
							<input type="checkbox" id="sub-math" name="subjects" value="Mathematics">
							<label class="pill-label" for="sub-math">Mathematics</label>
						</div>
					</div>
				</div>

				<button class="button" type="submit">
					Create free account
					<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
						<path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</form>

			<p class="auth-footer">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
		</section>
	</main>
</body>
</html>
