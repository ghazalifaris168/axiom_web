<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f8f8f5">
	<title>Log in — Axiom</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #202b27;
			--muted: #6d7872;
			--green: #245c49;
			--green-dark: #194b3a;
			--mint: #e8f0e9;
			--paper: #f8f8f5;
			--white: #fff;
			--line: #e7e9e3;
			--serif: Georgia, "Times New Roman", serif;
			--sans: "DM Sans", sans-serif;
			--display: "Manrope", sans-serif;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			background: var(--paper);
			color: var(--ink);
			font-family: var(--sans);
			-webkit-font-smoothing: antialiased;
		}
		a { color: inherit; text-decoration: none; }
		button, input { font: inherit; }

		/* Top Navigation */
		.topbar {
			height: 78px;
			display: flex;
			align-items: center;
			padding: 0 24px;
		}
		.nav {
			width: min(1120px, 100%);
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font: 800 20px var(--display);
			letter-spacing: -1px;
		}
		.brand-mark {
			width: 31px;
			height: 31px;
			display: grid;
			place-items: center;
			color: white;
			background: var(--green);
			border-radius: 10px 10px 10px 3px;
		}
		.brand-mark svg { width: 18px; height: 18px; }
		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			color: var(--muted);
			font-size: 13px;
			font-weight: 600;
			transition: color 0.2s;
		}
		.back-link:hover { color: var(--green); }
		.back-link svg { width: 16px; height: 16px; }

		/* Main Auth Container */
		main {
			flex: 1;
			display: grid;
			place-items: center;
			padding: 24px 18px 60px;
			position: relative;
			overflow: hidden;
		}
		.bg-blob {
			position: absolute;
			width: 480px;
			height: 480px;
			border-radius: 48% 52% 43% 57% / 49% 42% 58% 51%;
			background: #e8eee6;
			z-index: 0;
			pointer-events: none;
			transform: rotate(-12deg);
		}

		.auth-card {
			position: relative;
			z-index: 1;
			width: 100%;
			max-width: 410px;
			padding: 36px 34px;
			background: var(--white);
			border: 1px solid rgba(32, 43, 39, 0.08);
			border-radius: 16px;
			box-shadow: 0 20px 50px rgba(35, 55, 43, 0.07);
		}

		.auth-header {
			text-align: center;
			margin-bottom: 26px;
		}
		.eyebrow {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			color: var(--green);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.1px;
			text-transform: uppercase;
			margin-bottom: 10px;
		}
		.eyebrow-dot {
			width: 6px;
			height: 6px;
			background: #e6a967;
			border-radius: 50%;
		}
		h1 {
			margin: 0 0 8px;
			font: 700 28px/1.15 var(--display);
			letter-spacing: -1.2px;
		}
		h1 em {
			color: var(--green);
			font: italic 500 1em var(--serif);
			letter-spacing: -0.5px;
		}
		.auth-sub {
			margin: 0;
			color: var(--muted);
			font-size: 13px;
			line-height: 1.6;
		}

		/* Form Elements */
		.form-group {
			margin-bottom: 16px;
		}
		.label-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 7px;
		}
		label {
			display: block;
			font-size: 12px;
			font-weight: 600;
			color: var(--ink);
		}
		.forgot-link {
			font-size: 12px;
			font-weight: 600;
			color: var(--green);
		}
		.forgot-link:hover { text-decoration: underline; }

		.input-wrap {
			position: relative;
			display: flex;
			align-items: center;
		}
		input[type="email"],
		input[type="password"],
		input[type="text"] {
			width: 100%;
			height: 44px;
			padding: 0 14px;
			border: 1px solid var(--line);
			border-radius: 9px;
			background: var(--paper);
			color: var(--ink);
			font-size: 13px;
			transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
		}
		input:focus {
			outline: none;
			background: var(--white);
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgba(36, 92, 73, 0.12);
		}
		input::placeholder { color: #9aa19c; }

		.toggle-pw {
			position: absolute;
			right: 12px;
			background: none;
			border: 0;
			padding: 4px;
			color: var(--muted);
			cursor: pointer;
			display: grid;
			place-items: center;
		}
		.toggle-pw:hover { color: var(--ink); }
		.toggle-pw svg { width: 17px; height: 17px; }

		.button {
			width: 100%;
			height: 44px;
			margin-top: 6px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			border: 0;
			border-radius: 9px;
			background: var(--green);
			color: white;
			font-size: 13px;
			font-weight: 700;
			cursor: pointer;
			transition: background 0.2s, transform 0.2s;
		}
		.button:hover {
			background: var(--green-dark);
			transform: translateY(-1px);
		}
		.button svg { width: 16px; height: 16px; }

		.divider {
			display: flex;
			align-items: center;
			gap: 12px;
			margin: 22px 0;
			color: #9aa19c;
			font-size: 11px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		.divider::before,
		.divider::after {
			content: "";
			flex: 1;
			height: 1px;
			background: var(--line);
		}

		.google-btn {
			width: 100%;
			height: 43px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			background: var(--white);
			border: 1px solid var(--line);
			border-radius: 9px;
			color: var(--ink);
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s, border-color 0.2s;
		}
		.google-btn:hover {
			background: var(--paper);
			border-color: #d5d8d0;
		}

		.auth-footer {
			margin-top: 24px;
			text-align: center;
			font-size: 12px;
			color: var(--muted);
		}
		.auth-footer a {
			color: var(--green);
			font-weight: 700;
		}
		.auth-footer a:hover { text-decoration: underline; }

		.status-msg {
			display: none;
			margin-top: 14px;
			padding: 10px 12px;
			border-radius: 8px;
			background: var(--mint);
			color: var(--green-dark);
			font-size: 12px;
			font-weight: 600;
			text-align: center;
		}

		@media (max-width: 480px) {
			.auth-card { padding: 28px 22px; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<nav class="nav" aria-label="Secondary navigation">
			<a class="brand" href="{{ url_for('home') }}" aria-label="Axiom home">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none">
						<path d="M5 6.5c2.8-.9 5.2-.5 7 1.1v11c-1.8-1.6-4.2-2-7-1.1v-11Zm14 0c-2.8-.9-5.2-.5-7 1.1v11c1.8-1.6 4.2-2 7-1.1v-11Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
					</svg>
				</span>
				Axiom
			</a>
			<a class="back-link" href="main.html">
				<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
					<path d="M16 10H5m4-4-4 4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				Back to home
			</a>
		</nav>
	</header>

	<main>
		<div class="bg-blob" aria-hidden="true"></div>

		<section class="auth-card" aria-labelledby="login-title">
			<div class="auth-header">
				<div class="eyebrow"><span class="eyebrow-dot"></span> Welcome back</div>
				<h1 id="login-title">Pick up where you <em>left off.</em></h1>
				<p class="auth-sub">Sign in to access your study plan, notes, and progress.</p>
			</div>

			<form id="login-form" method="POST" action="{{ url_for('login_page') }}">
				<div class="form-group">
					<label for="email">Student email</label>
					<div class="input-wrap">
						<input id="email" name="email" type="email" placeholder="you@school.edu" required autocomplete="email">
					</div>
				</div>

				<div class="form-group">
					<div class="label-row">
						<label for="password">Password</label>
						<a class="forgot-link" href="#reset">Forgot password?</a>
					</div>
					<div class="input-wrap">
						<input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
					</div>
				</div>

				<!-- Error message display if login fails -->
				{% if error %}
				<div style="margin-bottom: 15px; padding: 10px; background: #fbeae8; color: #8c2d23; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center;">
					{{ error }}
				</div>
				{% endif %}

				<!-- ONLY ONE LOGIN BUTTON SHOULD BE HERE -->
				<button class="button" type="submit">
					Log in
					<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
						<path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			<div class="divider">or continue with</div>

			<button class="google-btn" type="button" id="google-login">
				<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
					<path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
					<path fill="#34A853" d="M12 24c3.3 0 6.08-1.09 8.1-2.96l-3.88-3.05c-1.1.74-2.51 1.18-4.22 1.18-3.25 0-6-2.19-6.98-5.14H1.01v3.14C3.05 21.2 7.24 24 12 24Z"/>
					<path fill="#FBBC05" d="M5.02 14.03c-.25-.74-.39-1.54-.39-2.36 0-.82.14-1.62.39-2.36V6.17H1.01C.37 7.45 0 8.89 0 10.42s.37 2.97 1.01 4.25l4.01-3.14Z"/>
					<path fill="#EA4335" d="M12 4.75c1.79 0 3.41.62 4.68 1.82l3.51-3.51C18.07 1.19 15.3 0 12 0 7.24 0 3.05 2.8 1.01 6.83l4.01 3.14c.98-2.95 3.73-5.22 6.98-5.22Z"/>
				</svg>
				Continue with Google
			</button>


			<p class="auth-footer">New to Axiom? <a href="{{ url_for('signup_page') }}">Create a free account</a></p>
		</section>
	</main>

	<script>
		// Toggle password visibility
		const toggleBtn = document.querySelector('.toggle-pw');
		const pwInput = document.querySelector('#password');

		toggleBtn.addEventListener('click', () => {
			const isHidden = pwInput.type === 'password';
			pwInput.type = isHidden ? 'text' : 'password';
			toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
		});

		// Handle demo form submission
		const form = document.querySelector('#login-form');
		const statusMsg = document.querySelector('#status-msg');

		form.addEventListener('submit', (e) => {
			e.preventDefault();
			const email = document.querySelector('#email').value;
			statusMsg.textContent = `Signed in as ${email}. Redirecting to your study space...`;
			statusMsg.style.display = 'block';
		});

		document.querySelector('#google-login').addEventListener('click', () => {
			statusMsg.textContent = 'Connecting to Google Sign-In...';
			statusMsg.style.display = 'block';
		});
	</script>
</body>
</html>
